
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIV Puzzle Float Layout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="smartStyle2.css">
</head>
<body>
  <div class="wrapper">
    <div class="header">#FFCE7a</div>

    <div class="contents clearfix">
      <div class="left-blue">
        #9DDDF4<br>
      </div>

      <div class="right-group">
        <div class="right-upper clearfix">
          <div class="col-green-pink">
            <div class="box-green">
              <p class="text-bottom">#C2FFC8</p>
            </div>
            <div class="box-pink">
              <p class="text-bottom">#FFC2C5</p>
            </div>
          </div>

          <div class="box-red">
            <p class="text-top-right">#F89C9C</p>
          </div>
        </div>

        <div class="box-yellow">#FFF083</div>
      </div>
    </div>

    <div class="footer">#BEA5FF</div>
  </div>
</body>
</html>
