<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レイアウト課題</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="smartStyle2.css">
</head>
<body>

    <!-- 全体を包む箱（幅400px） -->
    <div class="wrap">

        <!-- ヘッダー（オレンジ色） -->
        <header>
            <div class="header-box">
                <div class="green-box-small"></div>
                <div class="green-box-small"></div>
                <div class="green-box-small"></div>
            </div>
        </header>

        <!-- メインエリア（水色と緑色の横並び部分） -->
        <div class="container">
            <!-- 左サイドバー（水色） -->
            <div class="sidebar"></div>

            <!-- コンテンツエリア（緑色） -->
            <main class="content">
                <div class="pink-box"></div>
                <div class="pink-box"></div>
                <div class="pink-box"></div>
            </main>
        </div>

        <!-- フッター（紫色） -->
        <footer></footer>

    </div>

</body>
</html>
